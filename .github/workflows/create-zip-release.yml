name: Auto Zip and Release

on:
  push:
    branches: [main]
    paths:
      - 'ספרים/**'
  workflow_dispatch:
    inputs:
      post_only:
        description: 'פרסום הפוסט בפורום בלבד (בלי בנייה מחדש של הזיפים והרילים)'
        type: boolean
        default: false
      before_sha:
        description: 'טווח לדיווח: הקומיט שלפני (ריק = הקומיט האחרון שנגע בספרים)'
        type: string
        default: ''
      after_sha:
        description: 'טווח לדיווח: הקומיט שאחרי (ריק = הקומיט האחרון שנגע בספרים)'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: ${{ !inputs.post_only }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # רשימת הקבצים שהשתנו נגזרת מ-git ולא ממטען ה-push.
      # `github.event.commits` מחזיר רשימת קבצים ריקה עבור קומיט מיזוג, וגם
      # נחתך ב-20 קומיטים; בשני המקרים יצא "0 קבצים השתנו", כל הזיפים דולגו
      # וה-hash-ים ב-books_data.js נשארו ישנים — כך שהתוסף הציג "הכל מעודכן"
      # למרות שנוספו ושונו ספרים. git diff על טווח ה-push מדויק בשני המקרים.
      - name: Detect changed files
        if: ${{ !inputs.post_only }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # ריק = בנייה מלאה (workflow_dispatch, ריצה ראשונה, force-push)
          : > changed_files.txt
          if [ "$EVENT_NAME" != "push" ]; then
            echo "FULL_BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
             || ! git cat-file -e "$AFTER_SHA^{commit}" 2>/dev/null; then
            echo "טווח ה-push אינו זמין — בנייה מלאה"
            echo "FULL_BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # -z: שמות עם תווים לא-ASCII (עברית) יוצאים כמות שהם, בלי escaping
          git -c core.quotePath=false diff --name-only -z "$BEFORE_SHA" "$AFTER_SHA" \
            | tr '\0' '\n' > changed_files.txt
          echo "קבצים שהשתנו: $(wc -l < changed_files.txt)"

      - name: Build ZIPs and Manifest
        if: ${{ !inputs.post_only }}
        run: |
          python3 - <<'PYEOF'
          import os, json, zipfile, hashlib

          os.makedirs('dist', exist_ok=True)

          def fmt_size(b):
              if b >= 1 << 30: return f"{b / (1 << 30):.1f} GB"
              if b >= 1 << 20: return f"{b / (1 << 20):.1f} MB"
              if b >= 1 << 10: return f"{b / (1 << 10):.0f} KB"
              return f"{b} B"

          # ה-ZIP חייב לצאת זהה בית-בית עבור תוכן זהה: ה-hash שלו הוא מה
          # שקובע אצל המשתמש אם יש עדכון. זמן השינוי של קובץ ב-checkout הוא
          # זמן הריצה, ולכן בלי קיבועו כל בנייה מחדש הייתה משנה את ה-hash
          # ומאלצת את כל המשתמשים להוריד שוב אוסף שלא השתנה בו דבר.
          ZIP_EPOCH = (1980, 1, 1, 0, 0, 0)

          def make_zip(src_dir, zip_path):
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for dp, dns, fns in os.walk(src_dir):
                      dns.sort()
                      for fn in sorted(fns):
                          fp  = os.path.join(dp, fn)
                          arc = os.path.relpath(fp, src_dir).replace('\\', '/')
                          info = zipfile.ZipInfo(arc, date_time=ZIP_EPOCH)
                          info.compress_type = zipfile.ZIP_DEFLATED
                          info.external_attr = 0o644 << 16
                          with open(fp, 'rb') as src:
                              zf.writestr(info, src.read())

          def has_files(path):
              return any(fns for _, _, fns in os.walk(path))

          if not os.path.isdir('ספרים'):
              raise SystemExit("תיקיית 'ספרים' לא נמצאה!")

          # קביעת אילו קבצים השתנו — מ-changed_files.txt שחושב ב-git diff.
          # changed_files = None משמעו "בנה הכל".
          if os.environ.get('FULL_BUILD'):
              changed_files = None
              print("בנייה מלאה (workflow_dispatch / טווח push לא זמין)")
          else:
              with open('changed_files.txt', encoding='utf-8') as f:
                  changed_files = set(line.strip() for line in f if line.strip())
              print(f"קבצים שהשתנו: {len(changed_files)}")
              books_changed = {f for f in changed_files if f.startswith('ספרים/')}
              print(f"מתוכם תחת 'ספרים/': {len(books_changed)}")
              # רשת ביטחון: הוורקפלואו רץ רק כשנדחפו שינויים תחת 'ספרים/',
              # ולכן רשימה ריקה כאן פירושה שהזיהוי נכשל — עדיף לבנות הכל
              # מלבנות כלום ולהשאיר את המשתמשים עם hash-ים ישנים.
              if not books_changed:
                  print("לא זוהו שינויים תחת 'ספרים/' — נופלים לבנייה מלאה")
                  changed_files = None

          def is_folder_changed(folder_rel_path):
              """ZIP של תיקייה צריך להיבנות מחדש אם כל קובץ בתוכה (כולל תת-תיקיות) השתנה."""
              if changed_files is None:
                  return True
              prefix = f'ספרים/{folder_rel_path}/'
              return any(f.startswith(prefix) for f in changed_files)

          # טעינת manifest קודם לשמות ZIP יציבים ולנתוני תיקיות ללא שינוי
          prev_by_path = {}
          if os.path.exists('manifest.json'):
              with open('manifest.json', encoding='utf-8') as f:
                  for item in json.load(f):
                      prev_by_path[item['path']] = item

          max_counter = 0
          for item in prev_by_path.values():
              z = item.get('zip', '')
              if z.startswith('folder_') and z.endswith('.zip'):
                  try:
                      n = int(z[7:-4])
                      max_counter = max(max_counter, n)
                  except:
                      pass
          counter = max_counter + 1

          all_dirs = []
          for root, dirs, files in os.walk('ספרים'):
              dirs.sort()
              if root == 'ספרים':
                  continue
              rel = os.path.relpath(root, 'ספרים').replace('\\', '/')
              depth = rel.count('/')
              all_dirs.append((depth, rel, root))
          all_dirs.sort(key=lambda x: (x[0], x[1]))

          NO_SUBZIP = [
              'תלמוד ומפרשיו/תלמוד בבלי/שס וגשל',
              'כללים ומערכות/אנציקלופדיה תלמודית',
          ]

          def is_excluded(rel):
              for parent in NO_SUBZIP:
                  if rel.startswith(parent + '/'):
                      return True
              return False

          manifest = []
          rebuilt_zips = []

          for depth, rel, abs_path in all_dirs:
              if not has_files(abs_path):
                  continue
              if is_excluded(rel):
                  continue

              # שם ZIP יציב: שימוש חוזר בשם הקודם או הקצאת שם חדש
              if rel in prev_by_path:
                  zip_name = prev_by_path[rel]['zip']
              else:
                  zip_name = f"folder_{counter:04d}.zip"
                  counter += 1

              if is_folder_changed(rel):
                  zip_path = os.path.join('dist', zip_name)
                  make_zip(abs_path, zip_path)
                  size_str = fmt_size(os.path.getsize(zip_path))
                  with open(zip_path, 'rb') as zf:
                      zip_hash = hashlib.md5(zf.read()).hexdigest()
                  rebuilt_zips.append(zip_name)
                  print(f"[נבנה מחדש] {zip_name} = {rel} ({size_str}) [{zip_hash[:8]}]")
                  entry = {
                      "name":   os.path.basename(abs_path),
                      "path":   rel,
                      "zip":    zip_name,
                      "label":  os.path.basename(abs_path),
                      "parent": '/'.join(rel.split('/')[:-1]),
                      "size":   size_str,
                      "depth":  depth,
                      "hash":   zip_hash
                  }
              elif rel in prev_by_path:
                  # תיקייה ללא שינוי — שמירת נתונים קודמים כולל hash
                  entry = prev_by_path[rel]
                  print(f"[דולג]      {zip_name} = {rel} (ללא שינוי)")
              else:
                  # תיקייה חדשה שלא זוהתה כ"השתנתה" — בנה בכל זאת
                  zip_path = os.path.join('dist', zip_name)
                  make_zip(abs_path, zip_path)
                  size_str = fmt_size(os.path.getsize(zip_path))
                  with open(zip_path, 'rb') as zf:
                      zip_hash = hashlib.md5(zf.read()).hexdigest()
                  rebuilt_zips.append(zip_name)
                  print(f"[חדש]       {zip_name} = {rel} ({size_str})")
                  entry = {
                      "name":   os.path.basename(abs_path),
                      "path":   rel,
                      "zip":    zip_name,
                      "label":  os.path.basename(abs_path),
                      "parent": '/'.join(rel.split('/')[:-1]),
                      "size":   size_str,
                      "depth":  depth,
                      "hash":   zip_hash
                  }

              manifest.append(entry)

          with open('dist/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          books_js = 'const BOOKS_DATA = ' + json.dumps(manifest, ensure_ascii=False) + ';\n'
          with open('dist/books_data.js', 'w', encoding='utf-8') as f:
              f.write(books_js)

          with open('dist/rebuilt_zips.txt', 'w') as f:
              f.write('\n'.join(rebuilt_zips))

          print(f"\nmanifest.json נוצר עם {len(manifest)} ערכים")
          print(f"נבנו מחדש: {len(rebuilt_zips)} ZIPs (מתוך {len(manifest)} סה\"כ)")
          PYEOF

      - name: Commit manifest to repo
        if: ${{ !inputs.post_only }}
        run: |
          cp dist/manifest.json manifest.json
          cp dist/books_data.js books_data.js
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add manifest.json books_data.js
          git diff --cached --quiet || git commit -m "Update manifest + books_data [skip ci]"
          git pull --rebase origin main
          git push

      - name: Create or Update Release
        if: ${{ !inputs.post_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TIME=$(TZ='Asia/Jerusalem' date +'%d.%m.%Y בשעה %H:%M')
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "מאגר ספרים עדכני" --notes "initial" --latest
          gh release edit latest \
            --title "מאגר ספרים עדכני" \
            --notes "$(printf '## עדכון אוטומטי\n\nתאריך: **%s**' "$CURRENT_TIME")" \
            --latest

      - name: Upload Assets
        if: ${{ !inputs.post_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, json, sys, urllib.parse, urllib.request, subprocess

          token = os.environ['GITHUB_TOKEN']
          repo  = os.environ['REPO']

          with open('dist/rebuilt_zips.txt') as f:
              rebuilt = set(line.strip() for line in f if line.strip())

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/latest",
              headers={'Authorization': f'token {token}',
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'otzaria-uploader'}
          )
          with urllib.request.urlopen(req) as resp:
              release = json.loads(resp.read())
              release_id = release['id']

          # מחיקה רק של assets שנבנו מחדש + manifest.json
          for asset in release.get('assets', []):
              if asset['name'] in rebuilt or asset['name'] == 'manifest.json':
                  del_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}",
                      headers={'Authorization': f'token {token}'},
                      method='DELETE'
                  )
                  urllib.request.urlopen(del_req)
                  print(f"נמחק: {asset['name']}", flush=True)

          def upload(fpath, fname, label='', ctype='application/zip'):
              print(f"מעלה: {fname}", flush=True)
              url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={fname}"
              if label:
                  url += f"&label={urllib.parse.quote(label)}"
              r = subprocess.run([
                  'curl', '--fail-with-body', '-s',
                  '-X', 'POST',
                  '-H', f'Authorization: token {token}',
                  '-H', f'Content-Type: {ctype}',
                  '--data-binary', f'@{fpath}',
                  url
              ])
              if r.returncode != 0:
                  print(f"נכשל: {fname}", flush=True)
                  sys.exit(1)
              print(f"הושלם: {fname}", flush=True)

          with open('dist/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)

          # manifest.json תמיד עולה מחדש
          upload('dist/manifest.json', 'manifest.json', '', 'application/json')

          for item in sorted([i for i in manifest if i['zip'] in rebuilt and i['depth'] == 0], key=lambda x: x['zip']):
              upload(f"dist/{item['zip']}", item['zip'], item['label'])

          for item in sorted([i for i in manifest if i['zip'] in rebuilt and i['depth'] > 0], key=lambda x: (x['depth'], x['zip'])):
              upload(f"dist/{item['zip']}", item['zip'], item['label'])

          print(f"\nהועלו {len(rebuilt)} ZIPs")
          PYEOF

      - name: Cleanup Old Releases
        if: ${{ !inputs.post_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -v '^latest$' || true)
          if [ -n "$OLD" ]; then
            for tag in $OLD; do
              gh release delete "$tag" --yes --cleanup-tag
            done
          fi

      - name: Run Update Script
        env:
          BEFORE_SHA: ${{ inputs.before_sha || github.event.before }}
          AFTER_SHA:  ${{ inputs.after_sha || github.event.after }}
          USER_NAME:  ${{ secrets.USER_NAME }}
          PASSWORD:   ${{ secrets.PASSWORD }}
          TAG: latest
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config core.quotePath false
          python send_update.py
